name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SVGs were generated
        run: |
          if ! ls dist/*.svg >/dev/null 2>&1; then
            echo "::error::Pacman generation produced no SVGs in dist/ — upstream action failed silently."
            echo "Workspace:"; ls -la
            echo "dist (if any):"; ls -la dist 2>/dev/null || echo "  (no dist dir)"
            exit 1
          fi
          echo "Generated:"; ls -la dist/*.svg

      - name: Push pacman SVGs to pacman branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
